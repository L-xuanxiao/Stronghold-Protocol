name: Publish Android candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已审核的候选标签，例如 android-v0.1.3-100007'
        required: true
        type: string
      reviewed:
        description: '已审阅验证记录及未验证项目，同意公开发布此 APK'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: android-publish
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.reviewed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify unchanged candidate before publishing
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "if (!/^android-v\d+\.\d+\.\d+-\d+$/.test(process.env.TAG)) throw Error('invalid candidate tag')"
          mkdir candidate
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern '*.apk' --pattern '*.apk.sha256' --pattern '*.apk.json'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.1.0'
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > candidate/releases.json
          node mobile/ci/verify-candidate.mjs candidate candidate/releases.json
          commit=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')
          version=$(node -p "JSON.parse(require('fs').readFileSync(require('fs').readdirSync('candidate').filter(n => n.endsWith('.apk.json')).map(n => 'candidate/' + n)[0])).game.version")
          # 原候选改为持久草稿备份；新公开 Release 仅上传同一份已校验 APK。
          # 发布失败时，源码、签名记录与运行时输入仍在备份草稿中。
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --tag "inputs-$TAG" --title "Android $version 构建备份"
          gh release create "$TAG" candidate/*.apk --repo "$GITHUB_REPOSITORY" --target "$commit" --latest --title "卫戍协议 Android $version" --notes-file mobile/RELEASE-NOTES.md
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > candidate/published.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const metadata = JSON.parse(fs.readFileSync('candidate/' + fs.readdirSync('candidate').find(n => n.endsWith('.apk.json'))));
          const release = JSON.parse(fs.readFileSync('candidate/published.json')).flat().find(r => r.tag_name === process.env.TAG);
          assert(release && !release.draft && !release.prerelease, 'release was not published');
          assert.equal(release.assets.length, 1, 'public release must contain only the APK');
          assert.equal(release.assets[0].name, `Stronghold-Protocol-${metadata.game.version}-arm64-v8a.apk`);
          assert.equal(release.assets[0].digest, `sha256:${metadata.sha256}`, 'published bytes differ from verified APK');
          JS
